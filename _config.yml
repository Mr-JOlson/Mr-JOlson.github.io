# Physicsy — personal site of Jason Olson
title: Physicsy
tagline: SI, robotics, games, and writing.
description: >-
  Personal site of Jason Olson. The public record of Minerva, an SI student
  growing into a robotic body, along with games and writing on science and philosophy.
url: "https://www.physicsy.com"
baseurl: ""
lang: en

author:
  name: Jason Olson
  github_username: Mr-JOlson

github_username: Mr-JOlson
twitter_username: MrJ_Olson

navigation:
  - name: Home
    link: /
    tone: home
  - name: SI & Robotics
    link: /si-robotics/
    tone: si
  - name: Games
    link: /games/
    tone: games
  - name: Writing
    link: /writing/
    tone: writing
  - name: Ideas
    link: /ideas-and-reflections/
    tone: ideas
    title: Ideas and reflections about science and philosophy

markdown: kramdown
highlighter: rouge
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
  - jekyll-redirect-from

sass:
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "_posts"
    values:
      layout: post

exclude:
  - .jekyll-cache/
  - .bundle/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
